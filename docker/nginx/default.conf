server {
    listen 80;
    server_name _;

    # Root mengarah ke direktori public Laravel
    root  /var/www/html/public;
    index index.php;

    access_log /var/log/nginx/agfarm-access.log;
    error_log  /var/log/nginx/agfarm-error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Forward request PHP ke PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;
        
        fastcgi_pass         app:9000;
        fastcgi_index        index.php;
        fastcgi_param        SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include              fastcgi_params;
        fastcgi_read_timeout 60;
        fastcgi_buffers      16 16k;
        fastcgi_buffer_size  32k;
    }

    # Tolak akses ke hiddem file
    location ~ /\. {
        deny all;
    }

    # Cache asset statis
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires    max;
        log_not_found off;
        access_log off;
    }
}

